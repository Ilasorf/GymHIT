  <style>
    :root {
      --bg: #050505;
      --surface: #121212;
      --surface-2: #1a1a1a;
      --border: #2a2a2a;
      --text: #f8fafc;
      --muted: #a1a1aa;
      --neon: #95D600;
      --neon-dim: rgba(149, 214, 0, 0.14);
      --sky: #38bdf8;
      --sky-dim: rgba(56, 189, 248, 0.14);
      --warn: #f59e0b;
      --warn-dim: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --radius: 14px;

      /* === DIMENSIONI FONT CENTRALIZZATE === */
      --fs-micro: 12px;
      --fs-small: 14px;
      --fs-body: 16px;
      --fs-guide: 16px;
      --fs-title: 18px;
      --fs-header: 20px;
      --fs-num: 22px;
      --fs-timer: 26px;
    }

    body.profile-leone {
      --neon: #38bdf8;
      --neon-dim: rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: var(--fs-body);
      line-height: 1.45;
      padding-bottom: 165px;
      min-height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    button, a {
      touch-action: manipulation;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px 12px 24px 12px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: var(--fs-header);
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand h1 span {
      color: var(--neon);
    }

    .brand .sub {
      font-size: var(--fs-micro);
      color: var(--muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: var(--fs-small);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn.active {
      border-color: var(--neon);
      color: var(--neon);
      background: var(--neon-dim);
    }

    /* Profile Switcher */
    .profile-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--surface);
      padding: 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .profile-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 9px 8px;
      border-radius: 10px;
      font-size: var(--fs-body);
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .profile-btn.active {
      background: var(--neon-dim);
      border-color: var(--neon);
      color: var(--neon);
    }

    /* Status & Deload Banner */
    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .week-badge {
      font-size: var(--fs-small);
      font-weight: 800;
      color: var(--neon);
      background: var(--neon-dim);
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(149, 214, 0, 0.3);
    }

    body.profile-leone .week-badge {
      border-color: rgba(56, 189, 248, 0.35);
    }

    .deload-toggle {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: var(--fs-small);
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .deload-toggle.active {
      background: var(--warn-dim);
      border-color: var(--warn);
      color: var(--warn);
    }

    .deload-alert {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: var(--warn-dim);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde68a;
      font-size: var(--fs-small);
      display: none;
    }

    .deload-alert.show {
      display: block;
    }

    /* Workout Switcher */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 12px 8px;
      border-radius: var(--radius);
      font-size: var(--fs-body);
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn .tab-sub {
      display: block;
      font-size: var(--fs-micro);
      font-weight: 500;
      margin-top: 3px;
      opacity: 0.85;
    }

    .tab-btn.active {
      background: var(--neon-dim);
      border-color: var(--neon);
      color: var(--text);
    }

    .tab-btn.active .tab-title {
      color: var(--neon);
    }

    /* Breathing reminder */
    .breath-bar {
      background: var(--surface-2);
      border-left: 3px solid var(--neon);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: var(--fs-small);
      color: #e4e4e7;
      margin-bottom: 14px;
    }

    .breath-bar strong {
      color: var(--neon);
    }

    /* Section Cards */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: var(--fs-title);
      font-weight: 800;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip {
      font-size: var(--fs-micro);
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Mobility Checklist */
    .mob-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .mob-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .mob-item input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--neon);
      margin-top: 2px;
      flex-shrink: 0;
    }

    .mob-text strong {
      display: block;
      font-size: var(--fs-body);
    }

    .mob-text span {
      font-size: var(--fs-small);
      color: var(--muted);
    }

    /* Exercise Cards */
    .pair-label {
      font-size: var(--fs-small);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--neon);
      margin: 18px 0 8px 2px;
    }

    .ex-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .ex-code {
      display: inline-block;
      background: var(--neon);
      color: #050505;
      font-weight: 900;
      font-size: var(--fs-micro);
      padding: 2px 7px;
      border-radius: 5px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .ex-name {
      font-size: var(--fs-title);
      font-weight: 800;
      margin: 0;
      line-height: 1.25;
    }

    .ex-meta {
      font-size: var(--fs-small);
      color: var(--muted);
      margin-top: 5px;
    }

    .ex-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .guide-btn, .video-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: var(--fs-small);
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .video-btn {
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .video-btn:active {
      background: rgba(239, 68, 68, 0.2);
    }

    .guide-box {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: var(--surface-2);
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: var(--fs-guide);
      line-height: 1.45;
    }

    .guide-box.open {
      display: block;
    }

    .guide-box p {
      margin: 0 0 8px 0;
    }

    .guide-box p:last-child {
      margin-bottom: 0;
    }

    .g-setup { color: #38bdf8; font-weight: 800; }
    .g-exec { color: var(--neon); font-weight: 800; }
    .g-err { color: #f87171; font-weight: 800; }

    /* Progression Signal */
    .prog-banner {
      margin-top: 10px;
      padding: 8px 10px;
      border-
